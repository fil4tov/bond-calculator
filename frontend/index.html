<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Калькулятор годовой доходности облигаций с учетом купонов и разницы между ценой покупки и ценой выхода."
    />
    <title>Калькулятор доходности облигаций</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <script>
      (() => {
        try {
          const savedTheme = localStorage.getItem("bond-theme");
          const systemTheme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          document.documentElement.dataset.theme =
            savedTheme === "dark" || savedTheme === "light" ? savedTheme : systemTheme;
        } catch {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
