services:
  postgres-e2e:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bonds_e2e
      POSTGRES_USER: bonds_e2e
      POSTGRES_PASSWORD: bonds_e2e_password
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bonds_e2e -d bonds_e2e"]
      interval: 2s
      timeout: 3s
      retries: 15

  backend-e2e:
    build:
      context: ./backend
      target: runtime
    environment:
      DATABASE_URL: postgresql+asyncpg://bonds_e2e:bonds_e2e_password@postgres-e2e:5432/bonds_e2e
      SESSION_DAYS: 30
      COOKIE_SECURE: "false"
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      postgres-e2e:
        condition: service_healthy
    command:
      - sh
      - -c
      - alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000
