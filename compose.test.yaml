services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bonds_test
      POSTGRES_USER: bonds_test
      POSTGRES_PASSWORD: bonds_test_password
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bonds_test -d bonds_test"]
      interval: 2s
      timeout: 3s
      retries: 15

  backend-test:
    build:
      context: ./backend
      target: test
    environment:
      DATABASE_URL: postgresql+asyncpg://bonds_test:bonds_test_password@postgres-test:5432/bonds_test
      TEST_DATABASE_URL: postgresql+asyncpg://bonds_test:bonds_test_password@postgres-test:5432/bonds_test
      SESSION_DAYS: 30
      COOKIE_SECURE: "false"
    depends_on:
      postgres-test:
        condition: service_healthy
    command:
      - sh
      - -c
      - alembic upgrade head && python -m pytest
